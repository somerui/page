<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>hot-take</title>
	<link rel="stylesheet" href="/res/style.css">
	<style>
		main {
			width: 27.573%
		}
	</style>
</head>
<body>
    <main>
		<div id="title">
			<h1>hot-take machine</h1>
		</div>
		<div id="links">
			<div class="loc">
				<a href="#" id="btn1">CLICK</a>
				<hr>
				<div class="result">^	PRESS THE KEY TO LISTEN GOSSIPS</div>
			</div>
		</div>
		<div>
			<a href="/secret/">back</a>
		</div>
	</main>
	<script>
		document.getElementById('btn1').addEventListener('click', async (e) => {
			e.preventDefault();
			try {
				const response = await fetch('/secret/hot-take/deez.txt');
				const text = await response.text();
				const lines = text.split('\n').filter(line => line.trim() !== '');
				if (lines.length > 0) {
					const randomLine = lines[Math.floor(Math.random() * lines.length)];
					document.querySelector('.result').innerHTML = randomLine;
				}
			} catch (error) {
				console.error('Error reading file:', error);
				document.querySelector('.result').innerHTML = 'Error loading hot-take';
			}
		});
	</script>
</body>
</html>
